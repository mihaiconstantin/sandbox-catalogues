services:
    workspace:
        # The `LaTeX` development image.
        image: mihaiconstantin/sandbox-catalogues/base/latex

        # Build the image from the local `Dockerfile`.
        build:
            context: .
            dockerfile: recipes/latex/Dockerfile

            # Make the base `Ubuntu` image available for the build.
            additional_contexts:
                base-ubuntu: service:ubuntu
