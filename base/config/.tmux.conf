# Start window and pane numbers at 1 and close gaps when windows are removed.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Identify `tmux` correctly to applications.
set -s default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',xterm-256color:extkeys'
set -as terminal-features ',xterm:extkeys'
set -as terminal-features ',tmux-256color:extkeys'

# Keep escaping responsive (i.e., 10 milliseconds).
set -s escape-time 10

# Enable modern key/focus reporting.
set -s extended-keys on
set -s focus-events on
set -s extended-keys-format csi-u

# Increase scrollback buffer size for new panes.
set -g history-limit 50000

# Enable native mouse control (i.e., scrolling, selecting, and resizing panes).
set -g mouse on

# Scroll up by two lines per wheel event in `vi` copy mode.
bind -T copy-mode-vi WheelUpPane { select-pane; send-keys -X -N 2 scroll-up }
bind -T copy-mode-vi WheelDownPane { select-pane; send-keys -X -N 2 scroll-down }

# Set `less` behavior (i.e., two lines per wheel tick scrolling  and raw control characters).
set-environment -g LESS '--mouse --wheel-lines=2 -R'

# Use vi-style keys only in `tmux` copy mode, not in the shell.
set -g mode-keys vi

# Use the default system clipboard.
set -s set-clipboard on

# Use `v` to begin selection and `y` to copy and exit copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep mouse selections without copying or exiting copy mode on release.
unbind -T copy-mode-vi MouseDragEnd1Pane

# Leave `Ctrl+L` unbound to allow clearing the terminal screen in the shell.
unbind -q -n C-l

# Keybindings for creating windows and panes, preserving the working directory.
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Keybindings for resizing panes by 5 cells at a time.
bind -N 'Resize the pane Up by 5' -r S-Up { resize-pane -U 5 }
bind -N 'Resize the pane Down by 5' -r S-Down { resize-pane -D 5 }
bind -N 'Resize the pane Left by 5' -r S-Left { resize-pane -L 5 }
bind -N 'Resize the pane Right by 5' -r S-Right { resize-pane -R 5 }

# Prevent programs from renaming windows.
set -g allow-rename off

# Prevent aggressive resizing of panes when the terminal is resized.
set -gw aggressive-resize off

# Display options.
set -g status-style bg=default
set -g status-left ''
set -g status-right '#[fg=colour244]%H:%M  #[fg=blue]#S'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' • #I:#W#{?window_zoomed_flag, ⤢,} '
set -g window-status-current-style 'fg=green,bold'
set -g window-status-style 'fg=colour244'

# Reload the configuration with prefix+r.
bind r source-file ~/.tmux.conf \; display-message '`tmux` configuration reloaded.'
